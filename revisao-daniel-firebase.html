<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REVISÃO DANIEL</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2230;
    --border: #2a2f3d;
    --text: #e8eaf2;
    --text-muted: #6b7191;
    --text-dim: #3d4260;
    --green: #2ecc8a;
    --green-bg: #0d2b1e;
    --green-border: #1a4d35;
    --red: #ff5f6d;
    --red-bg: #2b0d12;
    --red-border: #4d1a1f;
    --accent: #7c8cf8;
    --accent-dim: #2a2f55;
    --orange: #f5a623;
    --orange-bg: #2b1f0d;
    --orange-border: #4d3a1a;
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
    font-size: 20px;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .screen.active { opacity: 1; pointer-events: all; }

  .btn {
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-size: 19px;
    padding: 14px;
  }

  #screen-loading { justify-content: center; align-items: center; gap: 20px; text-align: center; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #screen-loading p { color: var(--text-muted); font-size: 20px; }

  #screen-login {
    justify-content: center;
    align-items: center;
    gap: 32px;
    text-align: center;
  }
  #screen-login h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 48px;
    color: var(--accent);
  }
  #screen-login p { color: var(--text-muted); font-size: 19px; }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: var(--radius);
    padding: 18px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
    transition: transform .15s, opacity .15s;
  }
  .btn-google:active { transform: scale(0.97); opacity: .85; }
  .btn-google img { width: 24px; height: 24px; }

  #screen-review { gap: 0; padding-bottom: 0; overflow-y: auto; }

  .review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 12px;
    flex-shrink: 0;
  }
  .review-counter { font-size: 19px; font-weight: 600; color: var(--text-muted); }
  .review-counter span { color: var(--text); }

  .progress-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px;
    transition: width .4s ease;
  }

  .card-area {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    padding: 8px 0;
  }

  .flip-card {
    width: 100%;
    max-width: 440px;
    height: 540px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .flip-card.exit-left {
    transform: translateX(-80px) rotate(-5deg);
    opacity: 0;
    transition: transform .22s ease, opacity .22s ease;
  }
  .flip-card.exit-right {
    transform: translateX(80px) rotate(5deg);
    opacity: 0;
    transition: transform .22s ease, opacity .22s ease;
  }
  .flip-card.enter-right {
    transform: translateX(80px) rotate(5deg);
    opacity: 0;
    transition: none;
  }
  .flip-card.enter-left {
    transform: translateX(-80px) rotate(-5deg);
    opacity: 0;
    transition: none;
  }

  .card-face {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .card-back {
    transform: rotateY(180deg);
    background: var(--surface2);
    border-color: var(--accent);
    justify-content: safe center;
  }
  .card-face-content {
    font-size: 24px;
    line-height: 1.5;
    color: var(--text);
    font-weight: 400;
    text-align: center;
  }
  .card-front .card-face-content {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    color: var(--accent);
  }
  .card-tap-hint {
    font-size: 15px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    justify-content: center;
  }
  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    width: fit-content;
  }
  .badge-novo { background: var(--accent-dim); color: var(--accent); }
  .badge-revisao { background: var(--green-bg); color: var(--green); }
  .badge-futuro { background: #1a2b2b; color: #4ecdc4; border: 1px solid #2a4a4a; }

  .card-img {
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: var(--radius-sm);
    margin: 8px auto 0;
    display: block;
    cursor: zoom-in;
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: var(--radius-sm);
  }

  .eval-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 0 max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
    transition: opacity .3s ease;
  }
  .eval-buttons.hidden { display: none; }

  .btn-eval {
    border: none;
    border-radius: var(--radius);
    padding: 16px 16px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: transform .15s, filter .15s;
  }
  .btn-eval:active { transform: scale(0.95); }
  .btn-eval .eval-icon { font-size: 28px; }
  .btn-eval .eval-label { font-size: 18px; }
  .btn-lembrei { background: var(--green-bg); border: 1.5px solid var(--green-border); color: var(--green); }
  .btn-lembrei:active { filter: brightness(1.2); }
  .btn-nao-lembrei { background: var(--red-bg); border: 1.5px solid var(--red-border); color: var(--red); }
  .btn-nao-lembrei:active { filter: brightness(1.2); }

  #screen-summary {
    gap: 14px;
    padding-top: 32px;
    overflow-y: auto;
  }

  .summary-header { text-align: center; flex-shrink: 0; }
  .summary-header h2 { font-family: 'DM Serif Display', serif; font-size: 40px; }
  .summary-header p { color: var(--text-muted); font-size: 19px; margin-top: 6px; }

  .summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex-shrink: 0; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }
  .stat-number { font-family: 'DM Serif Display', serif; font-size: 48px; line-height: 1; }
  .stat-number.green { color: var(--green); }
  .stat-number.red { color: var(--red); }
  .stat-label { font-size: 15px; color: var(--text-muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }

  .summary-pct {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    flex-shrink: 0;
  }
  .pct-bar-bg { height: 10px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 12px 0 10px; }
  .pct-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease, background-color 0.5s ease; }
  .pct-label { display: flex; justify-content: space-between; font-size: 18px; color: var(--text-muted); }
  .pct-label strong { color: var(--text); font-size: 20px; }

  .summary-historico {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    flex-shrink: 0;
  }
  .hist-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hist-media { font-size: 22px; font-weight: 600; color: var(--accent); }
  .hist-dias { font-size: 18px; color: var(--text-muted); margin-top: 2px; }

  .hist-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 200px;
    margin-top: 14px;
  }
  .hist-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }
  .hist-bar {
    width: 100%;
    border-radius: 4px 4px 0 0;
    min-height: 4px;
  }
  .hist-bar-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

  .summary-syncing {
    text-align: center; font-size: 18px; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0;
  }

  .summary-actions {
    display: flex; flex-direction: column; gap: 10px;
    margin-top: auto;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 14px 24px; border-radius: 30px;
    font-size: 18px; opacity: 0; transition: all .3s ease; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #block-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
  }
  #block-overlay.active { display: block; }

  .img-retry-btn {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface2);
    color: var(--text-muted);
    margin: 8px auto;
    display: block;
    transition: transform .15s, filter .15s;
  }
  .img-retry-btn:active { transform: scale(0.95); filter: brightness(1.2); }
</style>
</head>
<body>

<div class="screen active" id="screen-loading">
  <div class="spinner"></div>
  <p id="loading-msg">Carregando…</p>
</div>

<div class="screen" id="screen-login">
  <h1>Revisão Daniel</h1>
  <p>Entre com sua conta Google para continuar</p>
  <button class="btn-google" onclick="fazerLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Entrar com Google
  </button>
</div>

<div class="screen" id="screen-inicio">
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:24px;">
    <h2 style="font-family:'DM Serif Display',serif; font-size:48px; color:var(--accent);">Revisão Daniel</h2>
    <p style="color:var(--text-muted); font-size:20px;" id="inicio-data"></p>
  </div>
  <div style="padding-bottom: max(16px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px;">
    <button class="btn btn-primary" onclick="iniciarRevisaoDiaria()">📖 Revisar</button>

  </div>
</div>

<div class="screen" id="screen-review">
  <div class="review-header">
    <div class="review-counter"><span id="counter-atual">1</span> de <span id="counter-total">0</span></div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="card-area">
    <div class="flip-card" id="flip-card" onclick="virarCard()">
      <div class="card-face card-front">
        <div class="card-badge" id="card-badge-front"></div>
        <div class="card-face-content" id="card-tema">—</div>
        <div class="card-tap-hint">👆 TOQUE PARA SABER MAIS 👆</div>
      </div>
      <div class="card-face card-back">
        <div class="card-face-content" id="card-text">—</div>
        <img class="card-img" id="card-img-item" src="" alt="" style="display:none" onclick="abrirLightboxAuto(event, this.dataset.basePath)">
        <div id="btn-ver-item-wrap" style="display:none; text-align:center; margin-top:12px;">
          <button class="btn" style="background:var(--green); color:#fff;" onclick="abrirLightboxAuto(event, document.getElementById('btn-ver-item-wrap').dataset.basePath)">▶ VER VÍDEO</button>
        </div>
      </div>
    </div>
  </div>
  <div id="btn-ver-imagem-wrap" style="display:none; padding: 8px 0 12px; text-align:center;">
    <button class="btn" style="background:var(--green); color:#fff;" onclick="abrirLightboxAuto(event, document.getElementById('btn-ver-imagem-wrap').dataset.basePath)">VER IMAGEM</button>
  </div>
  <div class="eval-buttons hidden" id="eval-buttons">
    <button class="btn-eval btn-nao-lembrei" onclick="avaliar('nao')">
      <span class="eval-icon">🔁</span>
      <span class="eval-label">Repetir</span>
    </button>
    <button class="btn-eval btn-lembrei" onclick="avaliar('sim')">
      <span class="eval-icon">⭐</span>
      <span class="eval-label">Decorei</span>
    </button>
  </div>
  <div style="padding: 0 0 max(16px, env(safe-area-inset-bottom));">
    <button class="btn btn-ghost" onclick="voltarAoMenu()">← Voltar ao menu</button>
  </div>
</div>

<div class="screen" id="screen-summary">
  <div class="summary-header">
    <h2 id="summary-emoji">✅ Revisão concluída!</h2>
    <p id="summary-data"></p>
  </div>
  <div class="summary-stats">
    <div class="stat-card">
      <div class="stat-number green" id="stat-lembrei">0</div>
      <div class="stat-label">Decorei</div>
    </div>
    <div class="stat-card">
      <div class="stat-number red" id="stat-nao">0</div>
      <div class="stat-label">Repetir</div>
    </div>
  </div>
  <div class="summary-pct">
    <div class="pct-label">
      <span>Hoje</span>
      <strong id="pct-valor">0%</strong>
    </div>
    <div class="pct-bar-bg">
      <div class="pct-bar-fill" id="pct-bar" style="width:0%"></div>
    </div>
    <div class="pct-label"><span id="pct-msg">—</span></div>
  </div>
  <div class="summary-historico" id="bloco-historico" style="display:none">
    <div class="hist-title">
      <span>📊 Histórico</span>
      <span class="hist-media" id="hist-media">—</span>
    </div>
    <div class="hist-dias" id="hist-dias">—</div>
    <div class="hist-bars" id="hist-bars"></div>
  </div>
  <div class="summary-syncing" id="sync-status"></div>
  <div class="summary-actions">
    <button class="btn btn-primary" id="btn-voltar-menu" style="display:none" onclick="voltarAoMenu()">← Voltar ao menu</button>
  </div>
</div>

<div class="screen" id="screen-erro">
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:24px; text-align:center; padding:0 32px;">
    <div style="font-size:64px;">⚠️</div>
    <h2 style="font-family:'DM Serif Display',serif; font-size:32px;">Falha na conexão</h2>
    <p style="color:var(--text-muted); font-size:20px; line-height:1.5;">Verifique sua internet e tente novamente.</p>
  </div>
  <div style="padding-bottom: max(16px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px;">
    <button class="btn btn-primary" onclick="inicializarApp()">🔄 Tentar novamente</button>
  </div>
</div>

<div id="lightbox" onclick="fecharLightbox()">
  <img id="lightbox-img" src="" alt="" style="max-width:95vw; max-height:95vh; object-fit:contain;">
  <video id="lightbox-video" autoplay loop playsinline webkit-playsinline style="display:none; max-width:95vw; max-height:95vh; object-fit:contain;" onclick="event.stopPropagation(); this.paused ? this.play() : this.pause()">
    Seu navegador não suporta vídeos.
  </video>
  <button id="lightbox-close" onclick="fecharLightbox()" style="position:fixed; top:20px; right:20px; background:rgba(255,0,0,0.8); color:#fff; border:3px solid #000; border-radius:50%; width:60px; height:60px; font-size:2rem; font-weight:bold; z-index:10001; display:flex; align-items:center; justify-content:center; cursor:pointer;">✕</button>
</div>
<div id="block-overlay"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc, updateDoc, setDoc, getDoc, query, where, orderBy, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8Dg8s-W6R8aWXUG4T41gxg-CsUWvMipw",
  authDomain: "revisaodaniel-7b75a.firebaseapp.com",
  projectId: "revisaodaniel-7b75a",
  storageBucket: "revisaodaniel-7b75a.firebasestorage.app",
  messagingSenderId: "94197706170",
  appId: "1:94197706170:web:5cdd5084bfc25f85d2c183",
  measurementId: "G-M5YGQK1HB3"
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();

const TETO_DIARIO = 40;
let itens = [];
let idx = 0;
let resultados = [];
let cardVirado = false;
let animando = false;
let sessaoConcluida = false;
let usuarioAtual = null;

function hojeStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function hojeDate() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}
function mostrarTela(id) {
  document.getElementById('block-overlay').classList.remove('active');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById(id).scrollTop = 0;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function configurarRetryImagem(imgElement, srcOriginal) {
  imgElement.onerror = function() {
    this.style.display = 'none';
    const parentContainer = this.parentElement;
    let retryBtn = parentContainer.querySelector('.img-retry-btn');
    if (!retryBtn) {
      retryBtn = document.createElement('button');
      retryBtn.className = 'img-retry-btn';
      retryBtn.innerHTML = '🔄 Tentar carregar imagem';
      retryBtn.onclick = (e) => {
        e.stopPropagation(); retryBtn.remove();
        imgElement.style.display = 'block';
        imgElement.src = srcOriginal + '?t=' + Date.now();
      };
      parentContainer.appendChild(retryBtn);
    }
  };
  imgElement.onload = function() {
    this.style.display = 'block';
    const retryBtn = this.parentElement.querySelector('.img-retry-btn');
    if (retryBtn) retryBtn.remove();
  };
}

window.fazerLogin = async function() {
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    const emailDoc = await getDoc(doc(db, 'authorized_emails', user.email));
    if (!emailDoc.exists() || !emailDoc.data().authorized) {
      await signOut(auth); mostrarTela('screen-login');
      alert(`🔒 Acesso negado.\n\nO e-mail "${user.email}" não tem permissão para acessar este app.`);
      return;
    }
  } catch (e) { toast('Erro ao fazer login'); }
};
window.fazerLogout = async function() { await signOut(auth); mostrarTela('screen-login'); };

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const emailDoc = await getDoc(doc(db, 'authorized_emails', user.email));
    if (!emailDoc.exists() || !emailDoc.data().authorized) {
      await signOut(auth); mostrarTela('screen-login'); return;
    }
    usuarioAtual = user;
    await inicializarApp();
  } else {
    usuarioAtual = null; mostrarTela('screen-login');
  }
});

async function inicializarApp() {
  mostrarTela('screen-loading');
  document.getElementById('loading-msg').textContent = 'Carregando itens do dia…';
  try { await carregarItens(); } catch (e) { mostrarTela('screen-erro'); }
}
window.inicializarApp = inicializarApp;

// ── CARREGAR ITENS ────────────────────────────────────────────────
async function carregarItens() {
  const hoje = hojeDate();
  const snap = await getDocs(collection(db, 'itens'));
  const todos = [];
  snap.forEach(d => todos.push({ docId: d.id, ...d.data() }));

  // IDs já revisados hoje
  const idsHoje = new Set();
  todos.forEach(item => {
    if (!item.ultimaRevisao) return;
    const ur = item.ultimaRevisao.toDate ? item.ultimaRevisao.toDate() : new Date(item.ultimaRevisao);
    ur.setHours(0,0,0,0);
    if (ur.getTime() === hoje.getTime()) idsHoje.add(String(item.id));
  });

  // Elegíveis: ativos e não revisados hoje (ou todos se já bateu o teto)
  const jaFeitos = idsHoje.size;
  const semTeto = jaFeitos >= TETO_DIARIO;

  const elegiveis = todos.filter(item => {
    if (!item.id) return false;
    if (item.status !== 'Ativo') return false;
    if (!semTeto && idsHoje.has(String(item.id))) return false;
    return true;
  });

  // Separa em 3 grupos com prioridade: novos > vencidos > futuros
  const novos    = [];
  const vencidos = [];
  const futuros  = [];

  elegiveis.forEach(item => {
    const rev = parseInt(item.totalRevisoes) || 0;
    const base = {
      docId: item.docId, id: item.id, tema: item.tema, item: item.item,
      ef: item.fatorFacilidade || 2.5, totalRevisoes: item.totalRevisoes || 0,
      imgTema: item.imgTema || '', imgItem: item.imgItem || ''
    };

    if (rev === 0) {
      // Nunca revisado — prioridade máxima, independente de data
      novos.push(base);
    } else {
      const proxRaw = item.proximaRevisao
        ? (item.proximaRevisao.toDate ? item.proximaRevisao.toDate() : new Date(item.proximaRevisao))
        : hoje;
      const prox = new Date(proxRaw); prox.setHours(0,0,0,0);
      if (prox <= hoje) {
        vencidos.push({ ...base, atraso: Math.floor((hoje - prox) / 86400000) });
      } else {
        futuros.push({ ...base, diasAdiantado: Math.floor((prox - hoje) / 86400000) });
      }
    }
  });

  novos.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  vencidos.sort((a, b) => b.atraso - a.atraso);
  futuros.sort((a, b) => a.diasAdiantado - b.diasAdiantado);

  // ── LÓGICA DO TETO ──────────────────────────────────────────────
  // Se ainda não atingiu os 40 obrigatórios: limita a sessão ao restante do teto
  // Se já passou dos 40: libera tudo sem limite (modo bônus)
  const faltamParaTeto = Math.max(0, TETO_DIARIO - jaFeitos);

  const candidatos = [...novos, ...vencidos, ...futuros];
  const sessao = semTeto ? candidatos : candidatos.slice(0, faltamParaTeto);

  itens = sessao;
  idx = 0;
  resultados = [];

  // Mensagem do dia anterior
  const historico = await getHistorico();
  const ontem = new Date();
  ontem.setDate(ontem.getDate() - 1);
  ontem.setHours(0,0,0,0);
  const ontemStr = `${ontem.getFullYear()}-${String(ontem.getMonth()+1).padStart(2,'0')}-${String(ontem.getDate()).padStart(2,'0')}`;

  const ontemSnap = await getDoc(doc(db, 'historico', ontemStr));
  if (!ontemSnap.exists()) {
    await setDoc(doc(db, 'historico', ontemStr), {
      data: ontemStr, lembrei: 0, naoLembrei: 0
    });
  }
  const diaAnterior = historico.find(h => h.data === ontemStr);

  let msgInicio = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  if (diaAnterior && diaAnterior.pct > 0) {
    const dataFmt = `${String(ontem.getDate()).padStart(2,'0')}/${String(ontem.getMonth()+1).padStart(2,'0')}/${ontem.getFullYear()}`;
    let frase = '';
    if (diaAnterior.pct >= 90)      frase = 'você teve um desempenho excelente! Você é uma máquina de estudar.';
    else if (diaAnterior.pct >= 70) frase = 'você teve um ótimo desempenho! Continue nesse ritmo.';
    else if (diaAnterior.pct >= 50) frase = 'você teve um desempenho regular. Tente intensificar mais o estudo.';
    else                             frase = 'você teve um desempenho ruim. Toma vergonha na cara e estuda.';
    msgInicio = `No dia ${dataFmt} ${frase}`;
  }
  document.getElementById('inicio-data').textContent = msgInicio;
  mostrarTela('screen-inicio');
}

// ── SM-2 ──────────────────────────────────────────────────────────
async function processarAvaliacao(item, avaliacao) {
  let ef            = parseFloat(item.ef)         || 2.5;
  let intervalo     = parseInt(item.intervalo)     || 1;
  let totalRevisoes = parseInt(item.totalRevisoes) || 0;
  let totalErros    = parseInt(item.totalErros)    || 0;

  if (avaliacao === 'Decorei') {
    if (totalRevisoes === 0)      intervalo = 1;
    else if (totalRevisoes === 1) intervalo = 6;
    else                          intervalo = Math.round(intervalo * ef);
    ef = Math.min(2.5, Math.max(1.3, ef + 0.1));
  } else {
    intervalo = 1; ef = Math.max(1.3, ef - 0.2); totalErros++;
  }
  totalRevisoes++;

  const proxRevisao = new Date(); proxRevisao.setHours(0,0,0,0);
  proxRevisao.setDate(proxRevisao.getDate() + intervalo);

  await updateDoc(doc(db, 'itens', item.docId), {
    proximaRevisao:  Timestamp.fromDate(proxRevisao),
    ultimaRevisao:   Timestamp.fromDate(hojeDate()),
    ultimoResultado: avaliacao,
    intervaloDias:   intervalo,
    fatorFacilidade: parseFloat(ef.toFixed(2)),
    totalRevisoes, totalErros
  });
  await atualizarHistoricoIncremental(avaliacao);
}

async function atualizarHistoricoIncremental(avaliacao) {
  const hoje = hojeStr();
  const ref = doc(db, 'historico', hoje);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const data = snap.data();
    if (avaliacao === 'Decorei') await updateDoc(ref, { lembrei: (data.lembrei||0)+1 });
    else                         await updateDoc(ref, { naoLembrei: (data.naoLembrei||0)+1 });
  } else {
    await setDoc(ref, { data: hoje, lembrei: avaliacao==='Decorei'?1:0, naoLembrei: avaliacao==='Decorei'?0:1 });
  }
}

async function getHistorico() {
  const snap = await getDocs(collection(db, 'historico'));
  const historico = [];
  snap.forEach(d => {
    const h = d.data();
    const total = (h.lembrei||0) + (h.naoLembrei||0);
    historico.push({ data: h.data, pct: Math.min(100, Math.round((total/TETO_DIARIO)*100)), lembrei: h.lembrei||0, naoLembrei: h.naoLembrei||0 });
  });
  historico.sort((a,b) => a.data.localeCompare(b.data));
  return historico;
}

// ── REVISÃO ───────────────────────────────────────────────────────
function iniciarRevisao() { mostrarTela('screen-review'); atualizarCard(false, 'right'); }

window.iniciarRevisaoDiaria = function() {
  if (!itens || itens.length === 0) { inicializarApp(); return; }
  iniciarRevisao();
};

function atualizarCard(animar, direcao) {
  const item  = itens[idx];
  const total = itens.length;

  document.getElementById('counter-atual').textContent = idx + 1;
  document.getElementById('counter-total').textContent = total;
  document.getElementById('progress-fill').style.width = ((idx / total) * 100) + '%';
  document.getElementById('card-tema').innerHTML = (item.tema || '—').replace(/\n/g,'<br>');
  document.getElementById('card-text').innerHTML = (item.item || '').replace(/\n/g,'<br>');

  const btnVerImagem = document.getElementById('btn-ver-imagem-wrap');
  if (item.imgTema === 'sim') {
    btnVerImagem.dataset.basePath = `imagens/tema_${item.id}`;
    btnVerImagem.dataset.temImagem = 'sim';
  } else { btnVerImagem.dataset.temImagem = 'nao'; }
  btnVerImagem.style.display = btnVerImagem.dataset.temImagem === 'sim' ? 'block' : 'none';

  const imgItem = document.getElementById('card-img-item');
  const btnVerItemWrap = document.getElementById('btn-ver-item-wrap');
  imgItem.src = ''; imgItem.style.display = 'none'; imgItem.onerror = null; imgItem.onload = null;
  const retryBtn = imgItem.parentElement.querySelector('.img-retry-btn');
  if (retryBtn) retryBtn.remove();
  btnVerItemWrap.style.display = 'none';

  if (item.imgItem === 'sim') {
    const basePath = `imagens/item_${item.id}`;
    btnVerItemWrap.dataset.basePath = basePath;
    const testImg = new Image();
    testImg.onload = function() {
      imgItem.src = basePath + '.png'; imgItem.dataset.basePath = basePath;
      imgItem.style.display = 'block'; configurarRetryImagem(imgItem, basePath + '.png');
    };
    testImg.onerror = function() { btnVerItemWrap.style.display = 'block'; };
    testImg.src = basePath + '.png';
  }

  const rev = parseInt(item.totalRevisoes) || 0;
  const badgeFront = document.getElementById('card-badge-front');
  if (item.diasAdiantado > 0) {
    badgeFront.className = 'card-badge badge-futuro';
    badgeFront.textContent = `⏭ +${item.diasAdiantado}d adiantado`;
  } else if (rev === 0) {
    badgeFront.className = 'card-badge badge-novo';
    badgeFront.textContent = '✨ Novo item';
  } else {
    badgeFront.className = 'card-badge badge-revisao';
    badgeFront.textContent = `🔁 ${rev}ª revisão`;
  }

  document.getElementById('eval-buttons').classList.add('hidden');
  cardVirado = false;
  const flipCard = document.getElementById('flip-card');
  if (animar) {
    const enterClass = direcao === 'right' ? 'enter-right' : 'enter-left';
    flipCard.classList.add(enterClass); flipCard.classList.remove('flipped');
    void flipCard.offsetWidth;
    setTimeout(() => { flipCard.classList.remove(enterClass); flipCard.style.transition = ''; }, 30);
  } else {
    flipCard.classList.remove('flipped'); flipCard.style.transition = 'none';
    void flipCard.offsetWidth; flipCard.style.transition = '';
  }
}

window.virarCard = function() {
  if (animando) return;
  animando = true;
  const flipCard = document.getElementById('flip-card');
  const evalBtns = document.getElementById('eval-buttons');
  if (!cardVirado) {
    cardVirado = true; flipCard.classList.add('flipped');
    document.getElementById('btn-ver-imagem-wrap').style.display = 'none';
    setTimeout(() => { animando = false; evalBtns.classList.remove('hidden'); }, 350);
  } else {
    cardVirado = false; flipCard.classList.remove('flipped'); evalBtns.classList.add('hidden');
    setTimeout(() => {
      animando = false;
      const bvi = document.getElementById('btn-ver-imagem-wrap');
      bvi.style.display = bvi.dataset.temImagem === 'sim' ? 'block' : 'none';
    }, 550);
  }
};

window.avaliar = async function(resp) {
  if (animando) return;
  animando = true;
  const item      = itens[idx];
  const flipCard  = document.getElementById('flip-card');
  const evalBtns  = document.getElementById('eval-buttons');
  const avaliacao = resp === 'sim' ? 'Decorei' : 'Repetir';
  resultados.push({ id: item.id, avaliacao });

  // Feedback visual durante salvamento
  evalBtns.style.opacity = '0.4';
  evalBtns.style.pointerEvents = 'none';
  const toastEl = document.getElementById('toast');
  toastEl.textContent = '💾 Salvando…';
  toastEl.classList.add('show');

  await processarAvaliacao(item, avaliacao).catch(() => {});

  toastEl.classList.remove('show');
  evalBtns.style.opacity = '';
  evalBtns.style.pointerEvents = '';

  if ((idx + 1) >= itens.length) sessaoConcluida = true;
  evalBtns.classList.add('hidden');
  flipCard.style.transition = 'transform .22s ease, opacity .22s ease';
  flipCard.classList.add('exit-left');
  setTimeout(async () => {
    flipCard.classList.remove('exit-left'); flipCard.style.transition = '';
    animando = false; idx++;
    if (idx >= itens.length) await mostrarResumo();
    else atualizarCard(true, 'right');
  }, 230);
};

// ── RESUMO ────────────────────────────────────────────────────────
window.mostrarResumo = async function() {
  mostrarTela('screen-loading');
  document.getElementById('loading-msg').textContent = 'Calculando aproveitamento…';
  const historico = await getHistorico();
  const hoje = hojeStr();
  const h = historico.find(x => x.data === hoje);
  const lembrei = h ? h.lembrei : 0;
  const nao     = h ? h.naoLembrei : 0;
  const total   = lembrei + nao;
  const pct     = Math.min(100, Math.round((total / TETO_DIARIO) * 100));

  document.getElementById('stat-lembrei').textContent = total > 0 ? lembrei : '—';
  document.getElementById('stat-nao').textContent     = total > 0 ? nao     : '—';
  document.getElementById('pct-valor').textContent    = total > 0 ? pct + '%' : '—';
  document.getElementById('summary-data').textContent = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('summary-emoji').textContent = '📊 HISTÓRICO';
  document.getElementById('pct-msg').textContent = '';
  document.getElementById('sync-status').innerHTML = total > 0 ? '<span style="color:var(--green)">✓ Itens salvos automaticamente</span>' : '';
  document.getElementById('btn-voltar-menu').style.display = '';

  const barEl = document.getElementById('pct-bar');
  const barColor = pct < 50 ? '#ff5f6d' : pct < 75 ? '#f5a623' : '#2ecc8a';
  barEl.style.background = barColor; barEl.style.transition = 'none'; barEl.style.width = '0%';
  renderizarHistorico(historico);
  mostrarTela('screen-summary');
  setTimeout(() => { barEl.style.transition = 'width 1s ease'; barEl.style.width = (total > 0 ? pct : 0) + '%'; }, 100);
};

function renderizarHistorico(historico) {
  const bloco = document.getElementById('bloco-historico');
  if (!historico || historico.length === 0) { bloco.style.display = 'none'; return; }
  bloco.style.display = 'block';
  const media = Math.round(historico.reduce((acc,h) => acc+h.pct, 0) / historico.length);
  const dias  = historico.length;
  document.getElementById('hist-media').textContent = `Média: ${media}%`;
  document.getElementById('hist-dias').textContent  = `${dias} dia${dias!==1?'s':''} de revisão`;
  const barsEl = document.getElementById('hist-bars'); barsEl.innerHTML = '';
  const hoje = new Date();
  for (let i = 6; i >= 0; i--) {
    const dia = new Date(hoje); dia.setDate(hoje.getDate() - i);
    const dataStr = `${dia.getFullYear()}-${String(dia.getMonth()+1).padStart(2,'0')}-${String(dia.getDate()).padStart(2,'0')}`;
    const label   = `${String(dia.getDate()).padStart(2,'0')}/${String(dia.getMonth()+1).padStart(2,'0')}`;
    const h = historico.find(x => x.data === dataStr);
    const wrap = document.createElement('div'); wrap.className = 'hist-bar-wrap';
    const pctLabel = document.createElement('div'); pctLabel.className = 'hist-bar-label';
    pctLabel.style.marginBottom = '4px'; pctLabel.style.color = 'var(--text-muted)';
    pctLabel.textContent = h ? `${h.pct}%` : '';
    const bar = document.createElement('div'); bar.className = 'hist-bar';
    if (h) {
      const cor = h.pct>=75 ? 'var(--green)' : h.pct>=50 ? 'var(--orange)' : 'var(--red)';
      bar.style.background = cor; bar.style.height = `${Math.max(6, Math.round((h.pct/100)*188))}px`;
      pctLabel.style.color = cor;
    } else { bar.style.background = 'var(--border)'; bar.style.height = '4px'; }
    const dayLabel = document.createElement('div'); dayLabel.className = 'hist-bar-label'; dayLabel.textContent = label;
    wrap.appendChild(pctLabel); wrap.appendChild(bar); wrap.appendChild(dayLabel); barsEl.appendChild(wrap);
  }
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────
window.voltarAoMenu = function() {
  document.getElementById('btn-voltar-menu').style.display = 'none';
  if (sessaoConcluida) { sessaoConcluida = false; itens = []; inicializarApp(); }
  else mostrarTela('screen-inicio');
};

const VIDEO_EXTS = ['.mp4','.webm','.mov','.avi'];
function isVideo(src) { return VIDEO_EXTS.some(ext => src.toLowerCase().endsWith(ext)); }
function abrirMidia(src) {
  const lb=document.getElementById('lightbox'), img=document.getElementById('lightbox-img'), video=document.getElementById('lightbox-video');
  if (isVideo(src)) { img.style.display='none'; img.src=''; video.style.display='block'; video.src=src; video.play(); }
  else { video.style.display='none'; video.pause(); video.src=''; img.style.display='block'; img.src=src; }
  lb.classList.add('active');
}
async function abrirMidiaAuto(basePath) {
  const exts=['.png','.jpg','.jpeg','.gif','.webp','.mp4','.webm','.mov'];
  for (const ext of exts) {
    const url = basePath+ext;
    const ok = await new Promise(resolve => {
      if (VIDEO_EXTS.includes(ext)) { const v=document.createElement('video'); v.onloadeddata=()=>resolve(true); v.onerror=()=>resolve(false); v.src=url; }
      else { const i=new Image(); i.onload=()=>resolve(true); i.onerror=()=>resolve(false); i.src=url; }
    });
    if (ok) { abrirMidia(url); return; }
  }
  toast('Mídia não encontrada');
}
window.abrirLightbox     = function(e,src)      { e.stopPropagation(); abrirMidia(src); };
window.abrirLightboxAuto = function(e,basePath) { e.stopPropagation(); abrirMidiaAuto(basePath); };
window.fecharLightbox    = function() {
  const lb=document.getElementById('lightbox'), video=document.getElementById('lightbox-video');
  lb.classList.remove('active'); video.pause(); video.src=''; document.getElementById('lightbox-img').src='';
};
